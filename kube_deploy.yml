---
- name: Deploy app to kubernets
  hosts: kubernetes
  remote_user: root

  tasks:
    
    - name: apply deployment 
      command: kubectl apply -f /root/my_deploy.yml

    - name: apply service
      command: kubectl apply -f /root/my_service.yml

    - name: update deployment with new pods if image updated to docker hub
      command: kubectl rollout restart deployment.apps/mydeployment  
